name: RSS Monitor

on:
  schedule:
    - cron: "*/30 * * * *" # 毎時0分と30分に実行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: default-monitor-state
  cancel-in-progress: false

env:
  MONITOR_REQUIRE_STATE: "true"

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup npm
        uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Load runtime state
        id: state
        uses: ./.github/actions/load-monitor-state
        with:
          state-path: state/default-state.json

      - name: Validate config and runtime state
        env:
          MONITOR_STATE_PATH: state/default-state.json
        run: npm run validate:config

      - name: Run RSS monitor
        id: monitor
        env:
          MONITOR_SOURCES_PATH: config/default-sources.json
          MONITOR_STATE_PATH: state/default-state.json
          DISCORD_WEBHOOK_URL_MAIN: ${{ secrets.DISCORD_WEBHOOK_URL_MAIN }}
        run: npm run monitor:rss:standard

      - name: Commit state
        if: always() && steps.state.outcome == 'success' && steps.monitor.outcome != 'skipped'
        uses: ./.github/actions/commit-monitor-state
        with:
          base-blob: ${{ steps.state.outputs.base-blob }}
          commit-message: Update RSS monitor state
          state-path: state/default-state.json
