name: X Twitter Monitor

on:
  schedule:
    - cron: "*/30 * * * *" # 毎時0分と30分に実行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: default-monitor-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup npm
        uses: ./.github/actions/setup-npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # service は steps より先に起動するため、Cookie を正規化してから明示的に起動する。
      - name: Start RSSHub
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: node dist/rsshub.js

      - name: Wait for RSSHub
        run: |
          # Docker service の起動直後は HTTP を受けられないことがあるため、短く再試行する。
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 "http://127.0.0.1:1200/" > /dev/null; then
              echo "RSSHub is ready."
              exit 0
            fi
            echo "Waiting for RSSHub (${attempt}/30)..."
            sleep 2
          done

          echo "RSSHub did not become ready in time."
          exit 1

      - name: Run X/Twitter monitor
        id: monitor
        env:
          MONITOR_SOURCES_PATH: config/default-sources.json
          MONITOR_STATE_PATH: state/default-state.json
          DISCORD_WEBHOOK_URL_MAIN: ${{ secrets.DISCORD_WEBHOOK_URL_MAIN }}
        run: npm run monitor:x-twitter

      - name: Commit state
        if: always() && steps.monitor.outcome != 'skipped'
        uses: ./.github/actions/commit-monitor-state
        with:
          commit-message: Update X Twitter monitor state
          state-path: state/default-state.json

      - name: Stop RSSHub
        if: always()
        run: docker rm --force x-twitter-rsshub 2>/dev/null || true
