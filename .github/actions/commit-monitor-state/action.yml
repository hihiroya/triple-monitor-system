name: Commit monitor state
description: Persist one loaded state file to monitor-state only, without changing main.

inputs:
  commit-message:
    description: Commit message for monitor state updates.
    required: true
  state-path:
    description: Existing monitor state file path.
    required: true
  base-blob:
    description: Blob returned by the successful load-monitor-state action.
    required: true

runs:
  using: composite
  steps:
    - name: Persist state without overwriting concurrent updates
      id: persist
      shell: bash
      env:
        STATE_PATH: ${{ inputs.state-path }}
        MONITOR_STATE_BASE_BLOB: ${{ inputs.base-blob }}
        MONITOR_STATE_COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: node dist/monitor-state-branch.js save "$STATE_PATH"

    - name: Preserve state and provenance for manual recovery
      if: failure() && steps.persist.outcome == 'failure'
      # actions/upload-artifact v7; verified upstream commit. No notification rerun.
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: monitor-state-recovery-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ inputs.state-path }}
          .monitor-state-baseline.json
          .monitor-state-recovery.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
